{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0">My blueprints</h5>
  <form action="/user_blueprints/refresh" method="post">
    <button type="submit" class="btn btn-sm btn-primary">Refresh from ESI</button>
  </form>
</div>
<div class="table-responsive-md">
  <table class="table table-hover">
    <tr>
      <th>Blueprint</th>
      <th>Produced item</th>
    </tr>
    {% for bp in blueprints %}
    <tr>
      <td>{{ bp.name }}</td>
      <td class="item_name">
        {% if bp.eve_item %}
        <a href="/items/{{ bp.eve_item.slug or bp.eve_item.id }}">{{ bp.eve_item.name }}</a>
        {% endif %}
      </td>
    </tr>
    {% else %}
    <tr><td colspan="2" class="text-center text-muted">No blueprints — click Refresh to fetch from ESI.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
