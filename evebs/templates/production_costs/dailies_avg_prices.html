{% extends 'base.html' %}
{% block content %}
<h2>{{ item.name }} - Weekly average price detail</h2>
<div class="table-responsive-md">
  <table class="table">
    <tr>
      <th>Day</th>
      <th class="text-end">Volume</th>
      <th class="text-end">Weighted avg price</th>
    </tr>
    {% for d in dailies_details %}
    <tr>
      <td>{{ d.day }}</td>
      <td class="text-end">{{ d.volume | vol }}</td>
      <td class="text-end">{{ d.weighted_avg_price | isk }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% include 'shared/pagination.html' %}
{% endblock %}
