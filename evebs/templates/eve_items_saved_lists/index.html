{% extends 'base.html' %}
{% block content %}
<h2>My saved lists</h2>
<a href="/eve_items_saved_lists/new" class="btn btn-primary mb-3">Save current list</a>
<ul class="list-group">
  {% for sl in saved_lists %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    {{ sl.description }}
    <span>
      <a href="/eve_items_saved_lists/{{ sl.id }}/load" class="btn btn-sm btn-secondary">Load</a>
      <form action="/eve_items_saved_lists/{{ sl.id }}/delete" method="post" style="display:inline">
        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
      </form>
    </span>
  </li>
  {% else %}
  <li class="list-group-item text-muted">No saved lists.</li>
  {% endfor %}
</ul>
{% endblock %}
