{% extends 'base.html' %}
{% block content %}
<h2>Activity log</h2>
<table class="table table-sm">
  <tr><th>Time</th><th>IP</th><th>User</th><th>Action</th></tr>
  {% for log in logs %}
  <tr>
    <td>{{ log.created_at }}</td>
    <td>{{ log.ip }}</td>
    <td>{{ log.user }}</td>
    <td>{{ log.action }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
