{% extends 'base.html' %}
{% block content %}
<h2>Choose trade hubs to monitor</h2>
<div class="row">
  <div class="col-md-6">
    <h4>Main hubs</h4>
    {% for th in inner_trade_hubs %}
    <div class="form-check">
      <input type="checkbox" class="form-check-input trade-hub-checkbox"
             id="th_{{ th.id }}" value="{{ th.id }}"
             {% if th.id in user_trade_hubs_ids %}checked{% endif %}>
      <label class="form-check-label" for="th_{{ th.id }}">
        {{ th.name }}{% if th.universe_constellation and th.universe_constellation.universe_region %} ({{ th.universe_constellation.universe_region.name }}){% endif %}
      </label>
    </div>
    {% endfor %}
  </div>
  <div class="col-md-6">
    <h4>Other hubs</h4>
    {% for th in outer_trade_hubs %}
    <div class="form-check">
      <input type="checkbox" class="form-check-input trade-hub-checkbox"
             id="th_{{ th.id }}" value="{{ th.id }}"
             {% if th.id in user_trade_hubs_ids %}checked{% endif %}>
      <label class="form-check-label" for="th_{{ th.id }}">
        {{ th.name }}{% if th.universe_constellation and th.universe_constellation.universe_region %} ({{ th.universe_constellation.universe_region.name }}){% endif %}
      </label>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll('.trade-hub-checkbox').forEach(function(cb) {
  cb.addEventListener('change', function() {
    fetch('/choose_trade_hubs/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'id=' + encodeURIComponent(cb.value) + '&check_state=' + encodeURIComponent(cb.checked)
    }).catch(function() { alert('Update failed.'); });
  });
});
</script>
{% endblock %}
