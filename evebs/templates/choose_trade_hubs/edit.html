{% extends 'base.html' %}
{% block content %}
<h2>Choose trade hubs to monitor</h2>
<div class="row">
  <div class="col-md-6">
    {% for th in trade_hubs %}
    <div class="form-check">
      <input type="checkbox" class="form-check-input trade-hub-checkbox"
             id="th_{{ th.id }}" value="{{ th.id }}"
             {% if th.id in user_trade_hubs_ids %}checked{% endif %}>
      <label class="form-check-label" for="th_{{ th.id }}">
        {{ th.name }}{% if th.universe_region %} ({{ th.universe_region.name }}){% endif %}
      </label>
    </div>
    {% endfor %}
  </div>
</div>
{% block scripts %}
<script>
document.querySelectorAll('.trade-hub-checkbox').forEach(function(cb) {
  cb.addEventListener('change', function() {
    var state = cb.checked;
    var id = cb.value;
    fetch('/choose_trade_hubs/update', {
      method: 'POST',
      body: new URLSearchParams({ id: id, check_state: state }),
    }).catch(function() { alert('Update failed.'); });
  });
});
</script>
{% endblock %}
{% endblock %}
