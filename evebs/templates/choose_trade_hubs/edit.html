{% extends 'base.html' %}
{% block content %}
<h2>Choose trade hubs to monitor</h2>
<div class="row">
  <div class="col-md-6">
    <h4>Main hubs</h4>
    {% for th in inner_trade_hubs %}
    <div class="form-check">
      <input type="checkbox" class="form-check-input trade-hub-checkbox"
             id="th_{{ th.id }}" value="{{ th.id }}"
             {% if th.id in user_trade_hubs_ids %}checked{% endif %}>
      <label class="form-check-label" for="th_{{ th.id }}">
        {{ th.name }}{% if th.region %} ({{ th.region.name }}){% endif %}
      </label>
    </div>
    {% endfor %}
  </div>
  <div class="col-md-6">
    <h4>Other hubs</h4>
    {% for th in outer_trade_hubs %}
    <div class="form-check">
      <input type="checkbox" class="form-check-input trade-hub-checkbox"
             id="th_{{ th.id }}" value="{{ th.id }}"
             {% if th.id in user_trade_hubs_ids %}checked{% endif %}>
      <label class="form-check-label" for="th_{{ th.id }}">
        {{ th.name }}{% if th.region %} ({{ th.region.name }}){% endif %}
      </label>
    </div>
    {% endfor %}
  </div>
</div>
{% block scripts %}
<script>
$(function() {
  $('.trade-hub-checkbox').change(function() {
    var state = $(this).is(':checked');
    var id = $(this).val();
    $.post('/choose_trade_hubs/update', { id: id, check_state: state })
      .fail(function() { alert('Update failed.'); });
  });
});
</script>
{% endblock %}
{% endblock %}
