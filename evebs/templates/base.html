<!DOCTYPE html>
<html lang="en">
<head>
  <title>{% block title %}{{ title or 'EveBusinessServer (Beta)' }} - EVE Online market information{% endblock %}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block meta_description %}Eve business server is a tool that show potential earnings in Eve Online{% endblock %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    .item_name a { text-decoration: none; }
    .information_highlight_left { border-left: 2px solid #dee2e6; }
    .nav-link.active { font-weight: bold; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div id="page-content">
    <div class="container-fluid">
      {% include 'shared/nav.html' %}
      {% include 'shared/errors.html' %}
      <div>
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function(el) {
      new bootstrap.Tooltip(el, { html: true });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
